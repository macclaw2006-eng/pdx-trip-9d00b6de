<!DOCTYPE html>
<html lang="zh">
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 Summer Nationals · 波特兰攻略地图(家庭版)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<style>

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    /* ---- ink scale ---- */
    --ink:#11161f; --ink-2:#39435a; --ink-3:#6a7589; --ink-4:#9aa4b6;
    --hair:rgba(17,22,31,.07); --hair-2:rgba(17,22,31,.11);
    --glass:rgba(255,255,255,.68); --glass-2:rgba(255,255,255,.80);
    --field:#f6f8fc;
    /* ---- category accents (chrome only; pin colors live in JS) ---- */
    --c-venue:#a83c4a; --c-hotel:#42607d; --c-food:#bd7a3c; --c-see:#4e8a72; --c-treat:#8f6a8e;
    --rose:#d2304a; --rednote:#ff2442;
    /* ---- layered soft shadows ---- */
    --sh-1:0 1px 2px rgba(17,24,39,.05), 0 1px 3px rgba(17,24,39,.05);
    --sh-2:0 2px 6px rgba(17,24,39,.06), 0 8px 22px rgba(17,24,39,.09);
    --sh-3:0 4px 12px rgba(17,24,39,.08), 0 18px 44px rgba(17,24,39,.16);
    --sh-up:0 -1px 1px rgba(17,24,39,.04), 0 -18px 50px rgba(17,24,39,.22);
    --blur:saturate(180%) blur(20px);
  }
  body{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#e8ebf1; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
  header{ padding:12px 16px 8px; }
  h1{ font-size:18px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:7px; letter-spacing:-.015em; }
  .hint{ font-size:12px; color:var(--ink-3); margin-top:3px; }
  .hint b{ color:var(--rose); }
  #map{ width:100%; height:74vh; min-height:520px; }

  /* line legend + filters (base; refined in app-shell) */
  .bar{ display:flex; flex-wrap:wrap; gap:7px; padding:8px 16px 10px; align-items:center; }
  .seg{ font-size:11px; font-weight:600; color:var(--ink-3); margin-right:2px; }
  .lg{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2); background:#fff; border:1px solid var(--hair); border-radius:999px; padding:5px 11px; cursor:pointer; user-select:none; }
  .lg .ln{ width:15px; height:5px; border-radius:5px; display:inline-block; }
  .lg .e{ font-size:13px; }
  .lg.off{ opacity:.4; }

  /* teardrop pins */
  .pinroot{ background:none; border:none; }
  .pin{ position:relative; }
  .pin svg{ display:block; filter:drop-shadow(0 1px 1px rgba(17,24,39,.16)) drop-shadow(0 4px 7px rgba(17,24,39,.22)); transition:transform .2s cubic-bezier(.34,1.56,.64,1); }
  .pin:hover svg{ transform:scale(1.07) translateY(-1px); }
  .pin .reddot{ position:absolute; top:-2px; right:-2px; width:11px; height:11px; border-radius:50%; background:var(--rednote); border:2px solid #fff; box-shadow:0 1px 3px rgba(255,36,66,.45); }
  .pin .pinlbl{ position:absolute; top:-15px; left:50%; transform:translateX(-50%); color:#fff;
       font-size:9.5px; font-weight:700; letter-spacing:.02em; padding:2px 8px; border-radius:999px; white-space:nowrap;
       box-shadow:0 2px 6px rgba(17,24,39,.22), inset 0 0 0 1px rgba(255,255,255,.22); }
  /* station marker */
  .stn{ display:flex; align-items:center; gap:5px; }
  .stn .nd{ width:10px; height:10px; border-radius:50%; background:#fff; border:2.5px solid #8a93a8; box-shadow:0 1px 3px rgba(17,24,39,.3); flex:0 0 auto; }
  .stn .nm{ background:rgba(255,255,255,.92); border:1px solid var(--hair); border-radius:7px; padding:2px 6px; font-size:10px; font-weight:600; color:var(--ink-2); white-space:nowrap; box-shadow:0 1px 3px rgba(17,24,39,.12); }
  .stn .nm small{ color:var(--ink-4); font-weight:500; }
  .stn.key .nd{ width:12px; height:12px; border-width:3px; border-color:var(--c-venue); }
  .stn.key .nm{ border-color:rgba(168,60,74,.28); color:var(--ink); box-shadow:0 1px 4px rgba(17,24,39,.16); }

  /* modal (reused) */
  .ov{ position:fixed; inset:0; background:rgba(17,22,31,.5); display:none; align-items:center; justify-content:center; z-index:1200; padding:18px; }
  .ov.on{ display:flex; }
  .modal{ background:#fff; border-radius:24px; max-width:430px; width:100%; max-height:86vh; overflow:auto; box-shadow:0 24px 70px rgba(17,24,39,.34); transform:scale(.9); opacity:0; transition:.18s; }
  .ov.on .modal{ transform:scale(1); opacity:1; }
  .mhead{ padding:0; color:var(--ink); position:relative; border-bottom:1px solid var(--hair); }
  .mhero{ position:relative; height:172px; overflow:hidden; border-radius:28px 28px 0 0; background:#dde2ea; }
  .mhero-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
  .mhero-ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .mhero-ph svg{ opacity:.95; filter:drop-shadow(0 3px 8px rgba(0,0,0,.22)); }
  .mhero::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:74px; background:linear-gradient(180deg,rgba(10,13,20,0),rgba(10,13,20,.46)); pointer-events:none; z-index:1; }
  .mbadge{ position:absolute; left:14px; bottom:13px; z-index:2; display:inline-flex; align-items:center; gap:5px; padding:5px 11px 5px 9px; border-radius:999px;
       background:rgba(17,22,31,.5); -webkit-backdrop-filter:saturate(160%) blur(10px); backdrop-filter:saturate(160%) blur(10px);
       border:1px solid rgba(255,255,255,.22); color:#fff; font-size:12px; font-weight:700; letter-spacing:.04em; box-shadow:0 2px 9px rgba(0,0,0,.26); }
  .mbadge svg{ display:block; }
  .mttl{ padding:15px 18px 16px; }
  .mhead h2{ font-size:20px; font-weight:700; line-height:1.24; letter-spacing:-.022em; color:var(--ink); }
  .mhead .sub{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 7px; margin-top:8px; }
  .mpill{ font-size:11px; font-weight:700; letter-spacing:.01em; padding:2.5px 9px; border-radius:999px; white-space:nowrap; line-height:1.55; }
  .msub{ font-size:12.5px; color:var(--ink-3); font-weight:500; line-height:1.4; }
  .mhead .x{ position:absolute; top:12px; right:12px; z-index:3; width:32px; height:32px; border-radius:50%;
       background:rgba(18,22,30,.42); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff;
       border:1px solid rgba(255,255,255,.2); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .mhead .x:active{ background:rgba(18,22,30,.62); }
  .mbody{ padding:16px 18px 26px; }
  .mbody .r{ display:flex; gap:13px; font-size:13.5px; color:var(--ink-2); padding:10px 0; line-height:1.55; border-top:1px solid var(--hair); align-items:baseline; }
  .mbody .r:first-child{ border-top:none; }
  .mbody .r .k{ flex:0 0 auto; width:58px; color:var(--ink-4); font-weight:600; font-size:11.5px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mbody .r > div{ flex:1; min-width:0; }
  .mbody .r b{ color:var(--rose); font-weight:700; }
  .lsvg{ display:inline-block; vertical-align:-.16em; flex:0 0 auto; }
  .gmap{ display:flex; align-items:center; gap:12px; text-decoration:none; background:linear-gradient(180deg,#3b7bf0,#2f67e0); border-radius:16px; padding:13px 15px; margin-bottom:14px;
       box-shadow:0 4px 14px rgba(47,103,224,.32), inset 0 1px 0 rgba(255,255,255,.22); transition:transform .15s ease, box-shadow .15s ease; }
  .gmap:active{ transform:scale(.985); box-shadow:0 2px 8px rgba(47,103,224,.3); } .gmap .pin{ font-size:19px; }
  .gmap .ga{ display:flex; flex-direction:column; line-height:1.3; }
  .gmap .ga b{ font-size:14px; color:#fff; font-weight:700; letter-spacing:-.01em; } .gmap .ga .gs{ font-size:11.5px; color:rgba(255,255,255,.86); margin-top:2px; }
  .gmap .ar{ margin-left:auto; color:#fff; font-weight:700; font-size:18px; }
  .xhsq{ background:#fff5f6; border:1px solid #ffe0e4; border-radius:14px; padding:11px 14px; margin-top:12px; font-size:12.8px; color:#9a2230; line-height:1.55; }
  .xhsq .t{ font-weight:700; color:var(--rednote); margin-bottom:3px; font-size:11.5px; letter-spacing:.02em; }
  .links{ margin-top:12px; } .links .lt{ font-weight:700; color:var(--rose); font-size:11.5px; margin-bottom:8px; letter-spacing:.02em; }
  .links a{ display:flex; align-items:center; gap:7px; font-size:12.6px; color:var(--ink-2); text-decoration:none; padding:9px 12px; background:var(--field); border:1px solid var(--hair); border-radius:12px; margin-bottom:6px; transition:background .15s; }
  .links a:active{ background:#eef2f9; } .links a .ar{ margin-left:auto; color:#3563d6; font-weight:700; }
  .h-venue{ background:linear-gradient(135deg,#b5505d,#9a3543); } .h-hotel{ background:linear-gradient(135deg,#4f6e8d,#3a5575); }
  .h-food{ background:linear-gradient(135deg,#c98a4f,#aa6b35); } .h-see{ background:linear-gradient(135deg,#5c9b80,#43795f); }
  .h-treat{ background:linear-gradient(135deg,#9b7a9a,#7c5d7b); }
  /* hub */
  .hubov{ position:fixed; inset:0; background:rgba(17,22,31,.5); display:none; align-items:center; justify-content:center; z-index:1100; padding:18px; }
  .hubov.on{ display:flex; }
  .hub{ background:#fff; border-radius:26px; max-width:700px; width:100%; max-height:90vh; overflow:auto; box-shadow:0 24px 70px rgba(17,24,39,.34); transform:scale(.92); opacity:0; transition:.18s; }
  .hubov.on .hub{ transform:scale(1); opacity:1; }
  .hubhead{ padding:16px 18px 14px; color:var(--ink); position:relative; display:flex; gap:13px; align-items:center; border-bottom:1px solid var(--hair); }
  .hubhead .hic{ flex:0 0 auto; width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:rgba(168,60,74,.11); }
  .hubhead h2{ font-size:18px; font-weight:700; letter-spacing:-.02em; }
  .hubhead .sub{ font-size:12.5px; color:var(--ink-3); margin-top:3px; font-weight:500; }
  .hubhead .x{ position:absolute; top:14px; right:15px; width:30px; height:30px; border-radius:50%; background:rgba(118,128,148,.13); color:var(--ink-3); border:none; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .hubhead .x:active{ background:rgba(118,128,148,.24); }
  .hubgrid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:16px 18px 22px; }
  .tile{ border:1px solid var(--hair); border-radius:16px; padding:14px 15px; cursor:pointer; background:#fbfcfe; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .tile:hover{ transform:translateY(-2px); box-shadow:var(--sh-2); border-color:transparent; }
  .tile:active{ transform:scale(.98); }
  .tile .tic{ font-size:22px; } .tile .tt{ font-weight:700; font-size:14px; margin-top:6px; color:var(--ink); letter-spacing:-.01em; }
  .tile .sh{ font-size:11.8px; color:var(--ink-3); margin-top:3px; line-height:1.45; }
  .tile .tic{ height:24px; }
  .tile .more{ font-size:11px; color:var(--c-venue); font-weight:600; margin-top:9px; display:inline-flex; align-items:center; gap:4px; }
  .hubnote{ margin:0 18px 20px; background:#fff5f6; border:1px solid #ffe0e4; border-radius:14px; padding:12px 14px; font-size:12.5px; color:#9a2230; line-height:1.55; }
  .hubnote b{ color:var(--rose); }
  .leaflet-container{ background:#e8edf2; }
  /* cluster bubble */
  .clroot{ background:none; border:none; }
  .clbubble{ display:flex; align-items:center; justify-content:center; border-radius:50%;
       background:rgba(38,46,62,.94); color:#fff; font-size:14px; font-weight:800; letter-spacing:-.3px;
       border:2.5px solid #fff; box-shadow:0 4px 12px rgba(23,32,46,.34); }
  .marker-cluster, .marker-cluster div{ background:none!important; }
  /* hub hero */
  .hub{ overflow:hidden; }
  .hubhero{ position:relative; height:148px; margin-top:-2px; overflow:hidden; }
  .hubhero img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hubhero::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.34)); }
  .hubhero-cap{ position:absolute; left:14px; bottom:11px; z-index:2; background:rgba(20,26,38,.6); color:#fff;
       font-size:12px; font-weight:800; padding:4px 11px; border-radius:20px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }

  /* Leaflet controls / tooltips / attribution */
  .leaflet-bar{ border:none !important; box-shadow:var(--sh-2) !important; border-radius:14px !important; overflow:hidden; }
  .leaflet-bar a{ background:var(--glass-2); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); color:var(--ink-2); border:none; width:34px; height:34px; line-height:34px; font-size:19px; font-weight:500; }
  .leaflet-bar a:hover{ background:#fff; color:var(--ink); }
  .leaflet-bar a:first-child{ border-bottom:1px solid var(--hair); }
  .leaflet-touch .leaflet-bar a{ border-radius:0; }
  .leaflet-top.leaflet-left{ top:calc(env(safe-area-inset-top) + 100px); left:12px; }
  .leaflet-tooltip{ background:rgba(17,22,31,.86); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; border:none; border-radius:9px; box-shadow:var(--sh-2); font-size:11px; font-weight:600; padding:5px 9px; letter-spacing:.005em; }
  .leaflet-tooltip:before{ display:none !important; }
  .leaflet-control-attribution{ background:rgba(255,255,255,.66) !important; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:var(--ink-4) !important; font-size:9px; border-radius:8px 0 0 0; padding:2px 7px; }
  .leaflet-control-attribution a{ color:var(--ink-3) !important; }

  /* ---- 手机竖屏优化 ---- */
  @media (max-width:600px){
    header{ padding:9px 13px 5px; }
    h1{ font-size:16px; gap:6px; }
    .hint{ font-size:10.5px; margin-top:3px; }
    .bar{ padding:6px 0 7px; margin:0 10px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .bar::-webkit-scrollbar{ display:none; }
    .bar .seg, .bar .lg{ flex:0 0 auto; }
    .lg{ font-size:12px; padding:5px 11px; }
    .modal{ max-width:none; border-radius:24px 24px 0 0; align-self:flex-end; max-height:90vh; }
    .ov{ padding:0; align-items:flex-end; }
    .mhead h2{ font-size:18.5px; } .mbody{ padding:16px 18px 26px; }
    .hub{ border-radius:24px 24px 0 0; max-height:92vh; }
    .hubov{ padding:0; align-items:flex-end; }
    .hubgrid{ gap:10px; padding:14px 16px 20px; }
  }

  /* ===== 手机优先 · 全屏地图 App 外壳 ===== */
  html,body{ height:100%; }
  body{ overflow:hidden; }
  header{ position:fixed; top:0; left:0; right:0; z-index:900; padding:env(safe-area-inset-top) 0 0; pointer-events:none; }
  .brand{ display:inline-flex; align-items:center; gap:9px; margin:11px 0 0 12px; background:var(--glass-2);
       -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
       padding:8px 14px 8px 9px; border-radius:16px; border:1px solid rgba(255,255,255,.5);
       box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,.6); pointer-events:auto; }
  .brand .bdg-ic{ width:28px; height:28px; border-radius:9px; background:linear-gradient(160deg,#222c3c,#10151d); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(17,24,39,.28); }
  .brand .bt{ font-size:14px; font-weight:700; color:var(--ink); letter-spacing:-.015em; }
  .brand .bs{ font-size:11px; font-weight:600; color:var(--ink-4); border-left:1px solid var(--hair-2); padding-left:9px; letter-spacing:.01em; }
  .bar{ position:fixed; top:calc(env(safe-area-inset-top) + 58px); left:0; right:0; z-index:900; margin:0;
       padding:0 12px 6px; display:flex; flex-wrap:nowrap; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch;
       scrollbar-width:none; pointer-events:none; background:none; border:none; }
  .bar::-webkit-scrollbar{ display:none; }
  .bar .seg{ display:none; }
  .bar .lg{ flex:0 0 auto; pointer-events:auto; background:var(--glass-2);
       -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
       box-shadow:var(--sh-1), inset 0 0 0 1px rgba(255,255,255,.5);
       border:none; font-size:12px; font-weight:600; color:var(--ink-2); padding:7px 13px; border-radius:999px; letter-spacing:.005em;
       transition:opacity .15s ease, background .15s ease, box-shadow .15s ease; }
  .bar .lg.sep{ width:1px; height:18px; padding:0; align-self:center; margin:0 1px; background:var(--hair-2); box-shadow:none; pointer-events:none; -webkit-backdrop-filter:none; backdrop-filter:none; border-radius:0; }
  .bar .lg .dotc{ width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 0 2px rgba(255,255,255,.55); }
  .bar .lg.off{ opacity:1; background:rgba(243,245,249,.72); color:var(--ink-4); box-shadow:inset 0 0 0 1px var(--hair); }
  .bar .lg.off .dotc,.bar .lg.off .ln{ opacity:.4; }
  /* FABs */
  .fab-list{ bottom:calc(env(safe-area-inset-bottom) + 80px); }
  /* list view */
  .listov{ position:fixed; inset:0; z-index:1150; background:rgba(17,22,31,.14); display:none; align-items:flex-end; }
  .listov.on{ display:flex; }
  .listpanel{ width:100%; max-width:600px; margin:0 auto; background:#fff; border-radius:28px 28px 0 0; max-height:78vh;
       display:flex; flex-direction:column; box-shadow:var(--sh-up); }
  .listhead{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 10px; font-size:17px; font-weight:700; color:var(--ink); letter-spacing:-.015em; }
  .listhead .x{ width:30px; height:30px; border-radius:50%; background:rgba(118,128,148,.13); color:var(--ink-3); border:none; font-size:15px; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .listhead .x:active{ background:rgba(118,128,148,.24); }
  .listbody{ overflow-y:auto; padding:0 14px calc(env(safe-area-inset-bottom) + 18px); }
  .lsec{ font-size:11px; font-weight:700; color:var(--ink-4); letter-spacing:.06em; margin:16px 6px 6px; }
  .litem{ display:flex; align-items:center; gap:13px; padding:11px 9px; border-radius:14px; cursor:pointer; transition:background .12s ease; }
  .litem:active{ background:#f2f5f9; }
  .litem .lic{ flex:0 0 auto; width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; }
  .litem .lic svg{ display:block; }
  .litem .lt1{ font-size:14px; font-weight:600; color:var(--ink); line-height:1.3; letter-spacing:-.01em; }
  .litem .lt2{ font-size:11.5px; color:var(--ink-3); margin-top:2px; }
  .litem .chev{ margin-left:auto; color:var(--ink-4); font-size:18px; font-weight:400; }
  /* selected pin + pulse */
  .pin.sel svg{ transform:scale(1.2) translateY(-2px); transform-origin:bottom center; filter:drop-shadow(0 2px 3px rgba(17,24,39,.24)) drop-shadow(0 9px 16px rgba(17,24,39,.32)); }
  .pin.sel::after{ content:''; position:absolute; left:50%; bottom:1px; width:12px; height:12px; border-radius:50%; transform:translate(-50%,50%); background:rgba(40,52,74,.16); pointer-events:none; animation:pinpulse 1.7s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes pinpulse{ 0%{ box-shadow:0 0 0 0 rgba(40,52,74,.3); } 70%{ box-shadow:0 0 0 18px rgba(40,52,74,0); } 100%{ box-shadow:0 0 0 0 rgba(40,52,74,0); } }
  #map{ position:fixed; inset:0; height:auto; z-index:1; }
  /* bottom sheets */
  .ov,.hubov{ background:rgba(17,22,31,.14); align-items:flex-end; padding:0; }
  .modal,.hub{ max-width:600px; margin:0 auto; width:100%; border-radius:28px 28px 0 0; max-height:64vh;
       transform:translateY(101%); opacity:1; transition:transform .34s cubic-bezier(.32,.72,0,1); box-shadow:var(--sh-up); }
  .ov.on .modal,.hubov.on .hub{ transform:translateY(0); }
  .hub{ max-height:80vh; }
  .sheethandle{ width:38px; height:5px; background:rgba(17,22,31,.14); border-radius:99px; margin:9px auto 2px; flex:0 0 auto; }
  .modal{ position:relative; }
  .ov .modal .sheethandle{ position:absolute; top:9px; left:50%; transform:translateX(-50%); z-index:4; margin:0; background:rgba(255,255,255,.7); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  /* locate FAB */

function pinIcon(poi){
  const col=CATCOLOR[poi.cat]||'#3a3f4a';
  const big=poi.cat==='venue', prom=poi.prom;
  const w=big?52:(prom?46:40), h=Math.round(w*1.34);
  const g=GLYPH[poi.cat]||'';
  const svg='<svg width="'+w+'" height="'+h+'" viewBox="0 0 24 31.7">'
    +'<path d="M12 0C6.2 0 1.5 4.7 1.5 10.5 1.5 18 12 31.5 12 31.5S22.5 18 22.5 10.5C22.5 4.7 17.8 0 12 0z" fill="'+col+'" stroke="#fff" stroke-width="1.4"/>'
    +'<g transform="translate(3.9,2.5) scale(0.675)" fill="#fff">'+g+'</g></svg>';
  const lbl=(big||prom)?'<div class="pinlbl" style="background:'+col+'">'+(big?'会场':poi.plbl)+'</div>':'';
  const dot=poi.xhs?'<i class="reddot"></i>':'';
  return L.divIcon({html:'<div class="pin">'+svg+lbl+dot+'</div>',className:'pinroot', iconSize:[w,h], iconAnchor:[w/2,h], popupAnchor:[0,-h]});
}

function gotoPOI(poi,m){
  const open=()=>{ selectMarker(m); poi.hub?openHub():openModal(poi); };
  if(m._fixed){ focusOn(poi.ll); open(); }
  else { cluster.zoomToShowLayer(m, ()=>{ selectMarker(m);
    setTimeout(()=>map.panBy([0,Math.round(map.getSize().y*0.24)],{animate:true}),60);
    poi.hub?openHub():openModal(poi); }); }
}

  m._fixed = (poi.cat==='venue' || poi.prom);
  m.on('click',()=>{ selectMarker(m); focusOn(poi.ll); poi.hub?openHub():openModal(poi); });
  (m._fixed ? fixedLayer : cluster).addLayer(m);
  (catMarkers[poi.cat]=catMarkers[poi.cat]||[]).push(m);
  poiMarkers.push({poi,m});
});

const hubGrid=document.getElementById('hubgrid');
HUB.forEach(h=>{ const t=document.createElement('div'); t.className='tile';
  var _hi=lsvg(HUBICON[String(h.ic).replace(/\uFE0F/g,'')]||'map',{size:22,color:'#46546e',sw:1.8});
  t.innerHTML='<div class="tic">'+_hi+'</div><div class="tt">'+h.tt+'</div><div class="sh">'+h.sh+'</div><div class="more">点击放大'+lsvg('zoom',{size:12})+'</div>';
  t.addEventListener('click',()=>openModal(h.det)); hubGrid.appendChild(t); });
const hubov=document.getElementById('hubov');
function openHub(){ hubov.classList.add('on'); }
function closeHub(){ hubov.classList.remove('on'); }
document.getElementById('hubClose').addEventListener('click',closeHub);
hubov.addEventListener('click',e=>{ if(e.target===hubov) closeHub(); });

// ---- MODAL ----
const ov=document.getElementById('ov');
function openModal(poi){
  const c=CAT[poi.cat]||{h:'h-see'};
  document.getElementById('mhead').className='mhead';
  const _col=CATCOLOR[poi.cat]||'#8a93a8';
  document.getElementById('mHero').className='mhero '+(c.h||'');
  document.getElementById('mPh').innerHTML=lsvg(poi.cat,{color:'rgba(255,255,255,.94)',size:56,sw:1.45});
  const _img=document.getElementById('mImg'); const _src=IMG[poi.title];
  if(_src){ _img.onerror=function(){ this.style.display='none'; }; _img.style.display='block'; _img.src=_src; }
  else{ _img.removeAttribute('src'); _img.style.display='none'; }
  document.getElementById('mBadge').innerHTML=lsvg(poi.cat,{color:'#fff',size:14,sw:2})+'<span>'+(CATBADGE[poi.cat]||'')+'</span>';
  const _t=String(poi.title); const _m=_t.match(/^([^（()]+?)\s*[（(]([^）)]+)[）)]\s*(.*)$/);
  let _name=_t,_pill=''; if(_m){ _name=(_m[1].trim()+(_m[3]?(' '+_m[3].trim()):'')).trim(); _pill=_m[2].trim(); }
  document.getElementById('mTitle').textContent=_name;
  let _sub=''; if(_pill) _sub+='<span class="mpill" style="color:'+_col+';background:'+_col+'1c">'+_pill+'</span>';
  if(poi.sub) _sub+='<span class="msub">'+deEmoji(poi.sub)+'</span>';
  document.getElementById('mSub').innerHTML=_sub;
  let html='';
  if(poi.gmap){ const q=encodeURIComponent(poi.gmap);
    html+='<a class="gmap" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener"><span class="pin">🧭</span><span class="ga"><b>用 Google 地图导航</b><span class="gs">'+(poi.addr||poi.gmap)+' · 看评分</span></span><span class="ar">›</span></a>'; }
  if(poi.html){ html+=poi.html; }
  (poi.rows||[]).forEach(r=>{ html+='<div class="r"><span class="k">'+keyText(r[0])+'</span><div>'+r[1]+'</div></div>'; });
  if(poi.xhs){ html+='<div class="xhsq"><div class="t">📕 小红书实测</div>'+poi.xhs+'</div>'; }
  if(poi.links&&poi.links.length){ html+='<div class="links"><div class="lt">📕 小红书相关帖子(点开看实拍)</div>';
    poi.links.forEach(l=>{ const u=XHS[l.k]||l.k; html+='<a href="'+u+'" target="_blank" rel="noopener">📕 '+l.t+'<span class="ar">↗</span></a>'; }); html+='</div>'; }
  document.getElementById('mBody').innerHTML=deEmoji(html);
  ov.classList.add('on');
}
function closeModal(){ ov.classList.remove('on'); selectMarker(null); }
document.getElementById('closeBtn').addEventListener('click',closeModal);
ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(ov.classList.contains('on')) closeModal(); else closeHub(); } });

// ---- focus marker above the bottom sheet ----
function focusOn(ll){
  const z=Math.max(map.getZoom(),14);
  map.setView(ll,z,{animate:true});
  setTimeout(()=>{ map.panBy([0, Math.round(map.getSize().y*0.26)],{animate:true}); },80);
}
// ---- geolocation: 你在这里 ----
let meMarker=null;
const locateBtn=document.getElementById('locateBtn');
locateBtn.addEventListener('click',()=>{ locateBtn.textContent='⏳'; map.locate({setView:true,maxZoom:16,enableHighAccuracy:true}); });
map.on('locationfound',e=>{
  locateBtn.textContent='📍';
  if(meMarker) meMarker.setLatLng(e.latlng);
  else meMarker=L.marker(e.latlng,{icon:L.divIcon({html:'<div class="mepin"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false,zIndexOffset:1500}).addTo(map);
});
map.on('locationerror',()=>{ locateBtn.textContent='📍'; alert('定位失败:请在浏览器/系统里允许本页访问定位。'); });

// ---- legend toggles ----
document.querySelectorAll('.lg[data-line]').forEach(lg=>{ lg.addEventListener('click',()=>{
  lg.classList.toggle('off'); const k=lg.dataset.line; const off=lg.classList.contains('off');
  if(off) map.removeLayer(lineLayers[k]); else lineLayers[k].addTo(map); }); });
document.querySelectorAll('.lg[data-cat]').forEach(lg=>{ lg.addEventListener('click',()=>{
  lg.classList.toggle('off'); const k=lg.dataset.cat; const off=lg.classList.contains('off');
  const ms=catMarkers[k]||[];
  ms.forEach(m=>{
    if(m._fixed){ if(off) fixedLayer.removeLayer(m); else fixedLayer.addLayer(m); }
    else { if(off) cluster.removeLayer(m); else cluster.addLayer(m); }
  });
}); });
document.querySelector('.lg[data-stn]').addEventListener('click',function(){
  this.classList.toggle('off'); if(this.classList.contains('off')) map.removeLayer(stnLayer); else stnLayer.addTo(map); });
document.querySelector('.lg[data-walk]').addEventListener('click',function(){
  this.classList.toggle('off'); if(this.classList.contains('off')) map.removeLayer(walkLayer); else walkLayer.addTo(map); });
</script>
